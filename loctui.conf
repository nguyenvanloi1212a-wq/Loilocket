# Shadowrocket Config - Full Suite 2026 (VanLoi206)
[Rule]
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

[Header Rewrite]
http-request ^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del x-revenuecat-etag
http-request ^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del X-RevenueCat-ETag

[Script]
# 1. Custom Caption Locket - Full 221 Captions (VanLoi206)
Locket_Loi = type=http-response,engine=jsc,script-path=https://raw.githubusercontent.com/nguyenvanloi1212a-wq/Loilocket/refs/heads/main/Locket_Loi.js,pattern=^https?:\/\/(?:api\.locket\.camera|api\.locketcamera\.com)\/.*,max-size=0,requires-body=true,timeout=10,script-update-interval=0,enable=true

# 2. Mở khóa Locket Gold (VanLoi206)
Locket_Gold_Loi = type=http-response,engine=jsc,script-path=https://raw.githubusercontent.com/nguyenvanloi1212a-wq/Loilocket/refs/heads/main/deleteHeader_Loi.js,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$),max-size=0,requires-body=true,timeout=60,script-update-interval=0,enable=true

# 3. Fake GPS nước Mỹ - Luồng Request (Chuẩn hóa Header)
Fake_GPS_Req = type=http-request, pattern=^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:\?.*)?$, requires-body=1, binary-body-mode=1, timeout=10, script-path=https://raw.githubusercontent.com/nguyenvanloi1212a-wq/Loilocket/refs/heads/main/gps_Loi.js, argument=prepareHeaders=true&debug=false

# 3. Fake GPS nước Mỹ - Luồng Response (Ghi đè tọa độ New York)
Fake_GPS_Res = type=http-response, pattern=^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:\?.*)?$, requires-body=1, binary-body-mode=1, max-size=1048576, timeout=10, script-path=https://raw.githubusercontent.com/nguyenvanloi1212a-wq/Loilocket/refs/heads/main/gps_Loi.js, argument=mode=response&latitude=40.7580&longitude=-73.9855&horizontalAccuracy=39&verticalAccuracy=1000&altitude=530&debug=false

